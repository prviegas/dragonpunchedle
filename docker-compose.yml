# Local development. `npm run db:up` starts just the database (the usual setup,
# with the API and page run by `npm run dev:*`). `npm run app:up` also builds
# and starts the production image, to try the real thing at http://localhost:8180.
# The password here is for local development only; production uses its own secret.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dragonpunchedle
      POSTGRES_PASSWORD: dragonpunchedle
      POSTGRES_DB: dragonpunchedle
    ports:
      - "5432:5432"
    volumes:
      # A named volume keeps the data when the container is recreated.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` return only once Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U dragonpunchedle -d dragonpunchedle"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    # Only started when asked for (`--profile app`), so `db:up` stays database-only.
    profiles: ["app"]
    build: .
    environment:
      # "db" is the database service's name on the network compose creates.
      DATABASE_URL: postgres://dragonpunchedle:dragonpunchedle@db:5432/dragonpunchedle
      # Plain http on localhost, so cookies can't require HTTPS here.
      SECURE_COOKIES: "false"
    ports:
      - "8180:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
