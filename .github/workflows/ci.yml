name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only read access: this workflow checks code, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL next to the job, the same version as docker-compose.yml,
    # so the database tests run against the real thing rather than a fake.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dragonpunchedle
          POSTGRES_PASSWORD: dragonpunchedle
          POSTGRES_DB: dragonpunchedle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragonpunchedle -d dragonpunchedle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://dragonpunchedle:dragonpunchedle@localhost:5432/dragonpunchedle

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json lists, and fails if the
      # lock file and package.json disagree.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the production Docker image and starts it against a real database:
  # proves the image boots, migrates, loads the roster and serves both the
  # page and the API, not just that it compiles.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dragonpunchedle
          POSTGRES_PASSWORD: dragonpunchedle
          POSTGRES_DB: dragonpunchedle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragonpunchedle -d dragonpunchedle"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - run: docker build -t dragonpunchedle .

      - name: Start the image and check it answers
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://dragonpunchedle:dragonpunchedle@localhost:5432/dragonpunchedle \
            -e SECURE_COOKIES=false \
            dragonpunchedle
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/puzzles/today
          curl -fsS http://localhost:3000/ | grep -q "<title>Dragonpunchedle</title>"
          test "$(docker inspect --format '{{.Config.User}}' dragonpunchedle)" = "node"

      - name: Show the container's log if anything failed
        if: failure()
        run: docker logs app
