<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragonpunchedle: the daily fighting game character guessing game</title>
    <meta
      name="description"
      content="Dragonpunchedle is a free daily guessing game for fighting game fans. Guess today's character from 1,100+ fighters across 25 series, including Street Fighter, Tekken, Mortal Kombat, Guilty Gear and King of Fighters."
    />
    <meta name="theme-color" content="#0a0c14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="%SITE_URL%/" />
    <!-- Proves to Google Search Console that this site is ours. -->
    <meta name="google-site-verification" content="4EvddLtIongZkgCB0EnDTaEGuRiaX8FXPQBUwDWwa1E" />

    <!-- Link previews (LinkedIn, WhatsApp, Discord, X...). These sites need full
         addresses, so %SITE_URL% is filled in at build time by vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dragonpunchedle" />
    <meta property="og:title" content="Dragonpunchedle: the daily fighting game character quiz" />
    <meta
      property="og:description"
      content="Guess today's fighter from 1,100+ characters across 25 series. Every guess shows how close you are."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dragonpunchedle logo beside a game panel: a health bar and rows of green, yellow and grey clue tiles" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
