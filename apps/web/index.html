<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragonpunchedle</title>
    <meta
      name="description"
      content="Guess today's fighting game character. 295 fighters from Street Fighter, Tekken, Mortal Kombat, Marvel, Guilty Gear and more, with a new puzzle every day."
    />
    <meta name="theme-color" content="#0a0c14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (LinkedIn, WhatsApp, Discord, X...). These sites need full
         addresses, so %SITE_URL% is filled in at build time by vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dragonpunchedle" />
    <meta property="og:title" content="Dragonpunchedle: the daily fighting game character quiz" />
    <meta
      property="og:description"
      content="Guess today's fighter from 295 characters across 18 franchises. Every guess shows how close you are."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Dragonpunchedle logo beside a game panel: a health bar and rows of green, yellow and grey clue tiles" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
