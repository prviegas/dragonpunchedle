<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url("../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 700;
        src: url("../../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 500;
        src: url("../../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Barlow";
        font-weight: 600;
        src: url("../../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2") format("woff2");
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        color: #eef0f6;
        font-family: "Barlow", sans-serif;
        background:
          radial-gradient(900px 420px at 30% -10%, rgb(255 59 48 / 0.22), transparent 65%),
          repeating-linear-gradient(135deg, rgb(255 255 255 / 0.025) 0 3px, transparent 3px 22px),
          #0a0c14;
      }
      .left { position: absolute; left: 64px; top: 100px; width: 600px; }
      .icon { width: 96px; height: 96px; display: block; margin-bottom: 34px; }
      .logo {
        font-family: "Barlow Condensed";
        font-weight: 800;
        font-size: 78px;
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .logo span { color: #6fd3df; }
      .tagline { margin-top: 24px; max-width: 560px; font-size: 32px; font-weight: 500; line-height: 1.3; color: #a3a9c2; }
      .tagline strong { color: #eef0f6; font-weight: 600; }

      .panel {
        position: absolute;
        right: 56px;
        top: 150px;
        width: 400px;
        padding: 30px 28px 32px;
        background: #141927;
        clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px);
      }
      .hud { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
      .hud .who { font-weight: 600; color: #a3a9c2; font-size: 20px; }
      .health { flex: 1; display: flex; gap: 4px; }
      .health span { flex: 1; height: 16px; background: #1b2133; }
      .health span.full { background: #e3b11c; }
      .hud .count { font-family: "Barlow Condensed"; font-weight: 700; font-size: 30px; line-height: 1; }
      .hud .count small { font-size: 18px; color: #6c7392; }
      .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
      .tile {
        height: 62px;
        border-radius: 5px;
        display: grid;
        place-items: center;
        font-family: "Barlow Condensed";
        font-weight: 700;
        font-size: 24px;
        color: #fff;
      }
      .g { background: #178a49; }
      .y { background: #d9a014; color: #221800; }
      .x { background: #343b55; }
      .caption {
        margin-top: 22px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6fd3df;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <img class="icon" src="../public/favicon.svg" alt="" />
      <h1 class="logo">Dragon<span>punched</span>le</h1>
      <p class="tagline">Guess today's fighting game character. <strong>295 fighters, 18 franchises,</strong> a new one every day.</p>
    </div>

    <div class="panel">
      <div class="hud">
        <span class="who">Today</span>
        <div class="health">
          <span class="full"></span><span class="full"></span><span class="full"></span><span class="full"></span>
          <span class="full"></span><span class="full"></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="count">6<small>/10</small></span>
      </div>
      <div class="row">
        <div class="tile g">✓</div><div class="tile y">▲</div><div class="tile x"></div><div class="tile g">✓</div>
      </div>
      <div class="row">
        <div class="tile y"></div><div class="tile g">✓</div><div class="tile x">▼</div><div class="tile y"></div>
      </div>
      <div class="row">
        <div class="tile g">✓</div><div class="tile g">✓</div><div class="tile g">✓</div><div class="tile g">✓</div>
      </div>
      <p class="caption">10 guesses · 8 clues</p>
    </div>
  </body>
</html>
